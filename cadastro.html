<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aqua Track | Criar Conta</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-page cadastro-page">

    <!-- =========================
         CABEÇALHO
    ========================== -->
    <header class="site-header">

        <div class="logo">
            <i class="fa-solid fa-droplet"></i>
            <span>Aqua <strong>Track</strong></span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>

            <a href="login.html" class="btn-primary">
                Entrar <i class="fa-solid fa-arrow-right"></i>
            </a>
        </nav>

    </header>


    <!-- =========================
         ÁREA DE CADASTRO
    ========================== -->
    <main class="auth-content">

        <section class="login-card">

            <!-- TÍTULO -->
            <div class="login-header">

                <h1>
                    Criar <span>sua conta</span>
                </h1>

                <div class="titulo-linha"></div>

                <p>
                    Cadastre-se para acessar<br>
                    todos os recursos do Aqua Track.
                </p>

            </div>


            <!-- =========================
                 MENSAGEM
            ========================== -->
            <div id="mensagem" class="erro-login" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="mensagemTexto"></span>
            </div>


            <!-- =========================
                 FORMULÁRIO
            ========================== -->
            <form id="cadastroForm" class="login-form">

                <!-- NOME -->
                <div class="campo">
                    <label for="nome">
                        Nome
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            autocomplete="name"
                            required
                        >

                    </div>
                </div>


                <!-- E-MAIL -->
                <div class="campo">
                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>
                </div>


                <!-- SENHA -->
                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="mostrarSenha('senha', this)"
                            aria-label="Mostrar senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR SENHA -->
                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite novamente sua senha"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="mostrarSenha('confirmarSenha', this)"
                            aria-label="Mostrar senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    id="btnCadastrar"
                    class="login-button"
                >
                    <i class="fa-solid fa-check"></i>
                    Criar conta
                </button>

            </form>


            <!-- =========================
                 VOLTAR PARA LOGIN
            ========================== -->
            <a href="login.html" class="register-button">
                <i class="fa-solid fa-arrow-left"></i>
                Já tenho uma conta
            </a>


            <!-- SEGURANÇA -->
            <div class="security">
                <i class="fa-solid fa-shield-halved"></i>
                Seus dados estão protegidos com segurança.
            </div>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->
    <footer class="auth-footer">
        © 2026 Aqua Track • Monitoramento inteligente da água
    </footer>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


    <script>

        /* ==========================================================
           CONFIGURAÇÃO DO FIREBASE
        ========================================================== */

        const firebaseConfig = {
            apiKey: "AIzaSyBDJjYlmWan7z_LEervJ_EhbZ2H78E6tog",
            authDomain: "monitoramento-ph-e-temperatura.firebaseapp.com",
            databaseURL: "https://monitoramento-ph-e-temperatura-default-rtdb.firebaseio.com",
            projectId: "monitoramento-ph-e-temperatura",
            storageBucket: "monitoramento-ph-e-temperatura.firebasestorage.app",
            messagingSenderId: "178735590696",
            appId: "1:178735590696:web:83d418e60905effcb2b41d"
        };


        /* ==========================================================
           INICIALIZAÇÃO
        ========================================================== */

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.database();


        /* ==========================================================
           ELEMENTOS
        ========================================================== */

        const formulario = document.getElementById("cadastroForm");
        const btnCadastrar = document.getElementById("btnCadastrar");

        const msgBox = document.getElementById("mensagem");
        const msgTexto = document.getElementById("mensagemTexto");


        /* ==========================================================
           MOSTRAR MENSAGEM
        ========================================================== */

        function exibirMsg(texto, tipo = "erro") {

            msgTexto.textContent = texto;

            msgBox.className =
                tipo === "sucesso"
                    ? "mensagem-sucesso"
                    : "erro-login";

            /*
             * IMPORTANTE:
             * As classes começam escondidas no CSS.
             * Aqui nós mostramos explicitamente a mensagem.
             */
            msgBox.style.display = "flex";
        }


        /* ==========================================================
           ESCONDER MENSAGEM
        ========================================================== */

        function esconderMsg() {

            msgBox.style.display = "none";
            msgTexto.textContent = "";

        }


        /* ==========================================================
           MOSTRAR / ESCONDER SENHA
        ========================================================== */

        function mostrarSenha(id, botao) {

            const campo = document.getElementById(id);

            if (campo.type === "password") {

                campo.type = "text";

                botao.innerHTML =
                    '<i class="fa-solid fa-eye-slash"></i>';

            } else {

                campo.type = "password";

                botao.innerHTML =
                    '<i class="fa-solid fa-eye"></i>';
            }
        }


        /* ==========================================================
           CADASTRO
        ========================================================== */

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            esconderMsg();


            /* -----------------------------------------
               PEGAR VALORES
            ----------------------------------------- */

            const nome =
                document.getElementById("nome").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;


            /* -----------------------------------------
               VALIDAÇÕES
            ----------------------------------------- */

            if (!nome) {

                exibirMsg("Digite seu nome.");

                return;
            }


            if (!email) {

                exibirMsg("Digite seu e-mail.");

                return;
            }


            if (senha.length < 6) {

                exibirMsg(
                    "A senha precisa ter pelo menos 6 caracteres."
                );

                return;
            }


            if (senha !== confirmarSenha) {

                exibirMsg(
                    "As senhas não são iguais."
                );

                return;
            }


            /* -----------------------------------------
               BLOQUEAR BOTÃO
            ----------------------------------------- */

            btnCadastrar.disabled = true;

            btnCadastrar.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';


            try {

                console.log("[Aqua Track] Iniciando cadastro...");
                console.log("[Aqua Track] E-mail:", email);


                /* -----------------------------------------
                   CRIAR USUÁRIO NO FIREBASE AUTHENTICATION
                ----------------------------------------- */

                const resultado =
                    await auth.createUserWithEmailAndPassword(
                        email,
                        senha
                    );


                const usuario = resultado.user;


                console.log(
                    "[Aqua Track] Usuário criado:",
                    usuario.uid
                );


                /* -----------------------------------------
                   SALVAR NOME NO PERFIL DO FIREBASE
                ----------------------------------------- */

                await usuario.updateProfile({

                    displayName: nome

                });


                /* -----------------------------------------
                   SALVAR DADOS DO USUÁRIO NO REALTIME DATABASE
                ----------------------------------------- */

                try {

                    await db
                        .ref("usuarios/" + usuario.uid)
                        .set({

                            nome: nome,

                            email: email,

                            criadoEm:
                                firebase.database.ServerValue.TIMESTAMP

                        });

                    console.log(
                        "[Aqua Track] Usuário salvo no Realtime Database."
                    );

                } catch (erroDatabase) {

                    /*
                     * O usuário já foi criado no Authentication.
                     * Se o Database tiver regras que bloqueiem a gravação,
                     * não apagamos a conta.
                     */

                    console.error(
                        "[Aqua Track] Erro ao salvar usuário no Database:",
                        erroDatabase
                    );

                }


                /* -----------------------------------------
                   SUCESSO
                ----------------------------------------- */

                exibirMsg(
                    "Conta criada com sucesso! Entrando...",
                    "sucesso"
                );


                btnCadastrar.innerHTML =
                    '<i class="fa-solid fa-check"></i> Conta criada!';


                /* -----------------------------------------
                   IR PARA DASHBOARD
                ----------------------------------------- */

                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "[Aqua Track] ERRO COMPLETO DO FIREBASE:",
                    error
                );

                console.error(
                    "[Aqua Track] Código do erro:",
                    error.code
                );

                console.error(
                    "[Aqua Track] Mensagem do erro:",
                    error.message
                );


                let mensagem =
                    "Não foi possível criar a conta.";


                /* -----------------------------------------
                   TRATAMENTO DOS ERROS
                ----------------------------------------- */

                switch (error.code) {

                    case "auth/email-already-in-use":

                        mensagem =
                            "Este e-mail já está cadastrado. Tente fazer login.";

                        break;


                    case "auth/invalid-email":

                        mensagem =
                            "Digite um e-mail válido.";

                        break;


                    case "auth/weak-password":

                        mensagem =
                            "A senha precisa ter pelo menos 6 caracteres.";

                        break;


                    case "auth/operation-not-allowed":

                        mensagem =
                            "O cadastro por e-mail e senha está desativado no Firebase. Ative o provedor E-mail/Senha no Firebase Authentication.";

                        break;


                    case "auth/api-key-not-valid":

                        mensagem =
                            "A chave do Firebase não foi aceita. Verifique a configuração do projeto Firebase.";

                        break;


                    case "auth/network-request-failed":

                        mensagem =
                            "Não foi possível conectar ao Firebase. Verifique sua internet.";

                        break;


                    case "auth/too-many-requests":

                        mensagem =
                            "Muitas tentativas foram feitas. Aguarde um pouco e tente novamente.";

                        break;


                    case "auth/unauthorized-domain":

                        mensagem =
                            "Este domínio não está autorizado no Firebase Authentication.";

                        break;


                    default:

                        mensagem =
                            "Erro do Firebase: " +
                            (error.code || "erro desconhecido");

                        break;
                }


                /* -----------------------------------------
                   MOSTRAR ERRO
                ----------------------------------------- */

                exibirMsg(mensagem);


                /* -----------------------------------------
                   LIBERAR BOTÃO
                ----------------------------------------- */

                btnCadastrar.disabled = false;

                btnCadastrar.innerHTML =
                    '<i class="fa-solid fa-check"></i> Criar conta';

            }

        });

    </script>

</body>

</html>
